bits:
  sweep_interval_secs: 5.0
  worker_server:
    host: "0.0.0.0"        # shared server for all remote pools
    port: 9001

targets:
  # Plain HTTP target — no dispatcher, runs inline with no concurrency limit.
  backend_inline:
    type: http
    url: "http://httpbin.org/post"

  # Async-pool executor (default) with a FIFO queue and bounded concurrency.
  backend_bounded:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      queue: fifo
      executor:
        type: async_pool
        concurrency: 4

  # Cost-weighted queue: cheaper jobs are promoted ahead of expensive ones.
  backend_priority:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      queue: cost_weighted
      executor:
        type: async_pool
        concurrency: 8
      # Per-user admission cap (queued + in-flight for this dispatcher). The
      # effective ceiling is identity-derived: the maximum over the global
      # default, the user's realm default, and any of the user's realm-scoped
      # roles. Roles only match within their own realm block.
      user_limit:
        max: 4                 # global default when the user's realm has no block
        realms:
          ecmwf:
            max: 20            # realm default (ecmwf users with no matching role)
            roles:
              premium: 100     # ceiling for role 'premium' within realm ecmwf
              admin: 1000
          other-realm:
            max: 8             # realm default, no role-specific ceilings

  # Thread-pool executor: each job runs on a dedicated OS thread.
  backend_threads:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      executor:
        type: thread_pool
        concurrency: 2

  # Remote-pool executor: jobs are handed off to external workers over HTTP.
  # The `remote` target type is required — it does nothing locally.
  # Pool name is derived from the registry entry name ("backend_remote").
  backend_remote:
    type: remote
    dispatcher:
      queue: fifo
      executor:
        type: remote_pool
        heartbeat_timeout_secs: 60

  # Second remote pool — shares the same HTTP server, different path prefix.
  backend_remote_slow:
    type: remote
    dispatcher:
      queue: cost_weighted
      executor:
        type: remote_pool
        heartbeat_timeout_secs: 120

routes:
  - default:
      - target::backend_inline
  - fast_remote:
      - target::backend_remote
  - slow_remote:
      - target::backend_remote_slow
