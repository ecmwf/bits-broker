[package]
name = "bits-ecmwf"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bits-ecmwf"
path = "src/bin/main.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "design_config_test"
path = "examples/design_config_test.rs"

[dependencies]
bits = { path = ".." }
async-trait = "0.1.88"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3"
inventory = "0.3"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
