steps:

  expand:
    via::metkit_expansion:
      expand_parameters: true

  valid_data:
    check::has_role:
      role: "valid_forecast"

  era5_data:
    check::match:
      class: "ea"

  era5_license:
    check::has_license:
      license: "era5"

  mars_od:
    route::mars_destination:
      endpoint: "mars.ecmwf.int:8080"

  dss_od:
    route::dss_destination:
      endpoint: "dss.ecmwf.int:9090"


routes:

  operational_forecast:
    - expand
    - valid_data
    - persist
    - mars_od

  era5_reanalysis:
    - expand
    - switch:
        era5_privileged:
          - era5_data
          - era5_license
          - persist
          - dss_od
        era5_public:
          - era5_data
          - dss_od

  extremes_dt:
    - valid_data
    - expand
    - dss_od

  extremes_fc:
    - valid_data
    - expand
    - dss_od
