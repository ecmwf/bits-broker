# Example BITS-ECMWF routing configuration.
#
# Uses ECMWF-specific action types registered by the bits-ecmwf crate.
# Dispatcher config (queue, executor) lives nested under `dispatcher:` in registry entries.

bits:
  persist_after_ms: 10000
  poll_timeout_ms: 30000
  persist_guard_ms: 1000

checks:

  valid_data:
    type: match
    class: od

  era5_data:
    type: match
    class: ea

  era5_license:
    type: has_license
    license: era5

transforms:

  expand:
    type: metkit_expansion
    expand_parameters: true

targets:

  mars_od:
    type: mars_destination
    endpoint: "mars.ecmwf.int:8080"
    dispatcher:
      queue: cost_weighted
      executor:
        type: async_pool
        concurrency: 10

  dss_od:
    type: dss_destination
    endpoint: "dss.ecmwf.int:9090"
    dispatcher:
      queue: fifo
      executor:
        type: async_pool
        concurrency: 8

routes:

  - operational_forecast:
      - transform::expand
      - check::valid_data
      - target::mars_od

  - era5_reanalysis:
      - transform::expand
      - switch:
          - era5_privileged:
              - check::era5_data
              - check::era5_license
              - target::dss_od
          - era5_public:
              - check::era5_data
              - target::dss_od

  - extremes_dt:
      - check::valid_data
      - transform::expand
      - target::dss_od

  - extremes_fc:
      - check::valid_data
      - transform::expand
      - target::dss_od
