[package]
name = "bits"
version = "0.1.1"
edition = "2024"

[lib]
name = "bits"
path = "src/lib.rs"

[features]
default = []
tikv = ["dep:tikv-client"]
nats = ["dep:async-nats"]
metrics-prometheus = ["dep:opentelemetry_sdk", "dep:opentelemetry-prometheus", "dep:prometheus"]

[[example]]
name = "hello_bits"
path = "examples/hello_bits.rs"

[dependencies]
async-trait = "0.1.88"
base64 = "0.22"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
thiserror = "2"
tokio-stream = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http-body-util = "0.1"
inventory = "0.3"
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = "0.8"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tikv-client = { version = "0.3", optional = true }
async-nats = { version = "0.38", optional = true }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-prometheus = { version = "0.32", optional = true }
prometheus = { version = "0.14", optional = true }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "pipelines"
harness = false

[[bench]]
name = "queues"
harness = false

[[bench]]
name = "metrics"
harness = false
required-features = ["metrics-prometheus"]
