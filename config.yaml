bits:
  job_cleanup_interval_ms: 5000

checks:
  is_privileged:
    type: has_role
    role: privileged

targets:
  # Plain HTTP target — no dispatcher, runs inline with no concurrency limit.
  backend_inline:
    type: http
    url: "http://httpbin.org/post"

  # Semaphore executor (default) with a FIFO queue and bounded concurrency.
  backend_bounded:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      queue: fifo
      concurrency: 4

  # Cost-weighted queue: cheaper jobs are promoted ahead of expensive ones.
  backend_priority:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      queue: cost_weighted
      concurrency: 8

  # Thread-pool executor: each job runs on a dedicated OS thread.
  backend_threads:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      executor: thread_pool
      concurrency: 2

  # Remote-pool executor: jobs are handed off to external workers over HTTP.
  # The `remote` target type is required — it does nothing locally.
  backend_remote:
    type: remote
    dispatcher:
      executor:
        remote_pool:
          bind: "0.0.0.0:9001"
          heartbeat_timeout_secs: 60
      queue: fifo
      concurrency: 16

routes:
  default:
    - switch:
        privileged:
          - check::is_privileged
          - target::backend
        public:
          - target::backend
