bits:
  job_cleanup_interval_ms: 5000

targets:
  # Plain HTTP target — no dispatcher, runs inline with no concurrency limit.
  backend_inline:
    type: http
    url: "http://httpbin.org/post"

  # Async-pool executor (default) with a FIFO queue and bounded concurrency.
  backend_bounded:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      queue: fifo
      executor:
        type: async_pool
        concurrency: 4

  # Cost-weighted queue: cheaper jobs are promoted ahead of expensive ones.
  backend_priority:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      queue: cost_weighted
      executor:
        type: async_pool
        concurrency: 8

  # Thread-pool executor: each job runs on a dedicated OS thread.
  backend_threads:
    type: http
    url: "http://httpbin.org/post"
    dispatcher:
      executor:
        type: thread_pool
        concurrency: 2

  # Remote-pool executor: jobs are handed off to external workers over HTTP.
  # The `remote` target type is required — it does nothing locally.
  backend_remote:
    type: remote
    dispatcher:
      queue: fifo
      executor:
        type: remote_pool
        bind: "0.0.0.0:9001"
        heartbeat_timeout_secs: 60

routes:
  default:
    - target::backend_inline
