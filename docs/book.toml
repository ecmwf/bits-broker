[book]
authors = ["BITS contributors"]
language = "en"
src = "src"
title = "BITS Documentation"

[build]
build-dir = "book"

[preprocessor.tabs]
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-css = ["theme/tabs.css", "theme/mermaid.css"]
additional-js = ["theme/tabs.js", "mermaid.min.js", "mermaid-init.js"]
