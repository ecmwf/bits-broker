[package]
name = "bits-ecmwf"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bits-ecmwf"
path = "src/bin/main.rs"

[dependencies]
bits = { path = "../bits" }
async-trait = "0.1.88"
axum = "0.8"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
futures = "0.3"
inventory = "0.3"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
