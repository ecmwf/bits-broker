# Example BITS routing configuration.
#
# Demonstrates:
#   - Named registries for reusable checks, transforms, and targets
#   - Dispatcher config (queue, concurrency) on target registry entries
#   - Switch for conditional branching
#   - Inline actions for one-off steps
#   - The persist built-in for durable jobs

checks:

  valid_data:
    type: has_role
    role: valid_forecast

  era5_data:
    type: match
    class: ea

  era5_license:
    type: has_license
    license: era5

transforms:

  expand:
    type: metkit_expansion
    expand_parameters: true

targets:

  mars_od:
    type: http
    url: "http://mars.ecmwf.int:8080/retrieve"
    queue: cost_weighted
    concurrency: 10

  dss_od:
    type: http
    url: "http://dss.ecmwf.int:9090/retrieve"
    queue: fifo
    concurrency: 8

routes:

  operational_forecast:
    - transform::expand
    - check::valid_data
    - persist
    - target::mars_od

  era5_reanalysis:
    - transform::expand
    - switch:
        era5_privileged:
          - check::era5_data
          - check::era5_license
          - persist
          - target::dss_od
        era5_public:
          - check::era5_data
          - target::dss_od

  extremes_dt:
    - check::valid_data
    - transform::expand
    - target::dss_od

  extremes_fc:
    - check::valid_data
    - transform::expand
    - target::dss_od
