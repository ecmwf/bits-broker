[package]
name = "bits"
version = "0.1.0"
edition = "2021"

[lib]
name = "bits"
path = "src/lib.rs"


[dependencies]
postgres = { version = "0.19.10", features = ["with-serde_json-1", "with-chrono-0_4"] }
rand = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
testcontainers-modules = { version = "0.12.1", features = ["blocking", "postgres"] }
chrono = "0.4.41"

[dev-dependencies]
tempfile = "3.8"
