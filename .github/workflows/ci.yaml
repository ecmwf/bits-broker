name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        env:
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy ALL_PROXY all_proxy
          cargo test --workspace --exclude bits-py -- --test-threads=1

      - name: Compile-check nats-gated tests
        # The `nats` feature is off by default, so `nats`-gated test files
        # (e.g. user_limit_nats.rs) are normally excluded from the build and
        # would not catch API changes. This compiles them without a server.
        run: cargo test -p bits --features nats --no-run
