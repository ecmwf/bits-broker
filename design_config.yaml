# Example ECMWF routing config demonstrating the full dispatcher architecture.
#
# Dispatcher config (queue, executor) lives inside a `dispatcher:`
# key within the registry entry, or as a sibling `dispatcher:` key for inline steps.
#
# queue:
#   fifo          — first-in, first-out ordering
#   cost_weighted — cheaper jobs (lower metadata["cost"]) run first
#
# executor:
#   async_pool    — inline async, bounded by executor.concurrency (default)
#   thread_pool   — offload to dedicated OS threads (CPU/blocking work)
#   remote_pool   — hand off to external workers via HTTP long-poll
#                   (only valid with target::remote)

bits:
  # For long-running jobs: persist once after this threshold.
  persist_after_ms: 10000
  # Guarantee persistence happens before a poll timeout can naturally elapse.
  poll_timeout_ms: 30000
  persist_guard_ms: 1000

checks:

  valid_data:
    type: match
    class: od

  era5_data:
    type: match
    class: ea

  era5_license:
    type: has_license
    license: era5

transforms:

  expand:
    type: metkit_expansion
    expand_parameters: true
    dispatcher:
      executor:
        type: async_pool
        concurrency: 16           # limit concurrent calls to the expansion service

targets:

  mars_od:
    type: http
    url: "http://mars.ecmwf.int:8080/retrieve"
    dispatcher:
      queue: cost_weighted      # cheap jobs first
      executor:
        type: thread_pool     # run each job on a dedicated thread to avoid blocking the dispatcher
        concurrency: 10


  dss_od:
    type: http
    url: "http://dss.ecmwf.int:9090/retrieve"
    dispatcher:
      queue: fifo
      executor:
        type: async_pool
        concurrency: 8

  fdb_worker:
    type: remote              # noop — work is done by external FDB workers
    dispatcher:
      queue: cost_weighted
      executor:
        type: remote_pool
        bind: "0.0.0:9001"
        heartbeat_timeout_secs: 60


routes:

  operational_forecast:
    - transform::expand
    - check::valid_data
    - transform::uses_tapes_or_not
    - transform::tape_cost_estimation: ~
      dispatcher:
        queue: cost_weighted
        executor:
          type: thread_pool
          concurrency: 20
    - target::mars_od

  era5_reanalysis:
    - transform::expand
    - switch:
        era5_privileged:
          - check::era5_data
          - check::era5_license: ~
            dispatcher:
              queue: fifo
              executor:
                type: async_pool
                concurrency: 400
          - target::dss_od
        era5_public:
          - check::era5_data
          - target::dss_od

  extremes_dt:
    - check::valid_data
    - transform::expand
    - target::fdb_worker

  extremes_fc:
    - check::valid_data
    - transform::expand
    - target::fdb_worker
