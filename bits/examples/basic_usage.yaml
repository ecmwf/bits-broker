# Example BITS routing configuration.
#
# Demonstrates:
#   - Named registries for reusable checks, transforms, and targets
#   - Dispatcher config (queue, concurrency) nested under `dispatcher:` in registry entries
#   - Switch for conditional branching
#   - Inline actions for one-off steps
#   - Optional time-based persistence policy for durable jobs

bits:
  persist_after_ms: 10000
  poll_timeout_ms: 30000
  persist_guard_ms: 1000

checks:

  valid_data:
    type: has_role
    role: valid_forecast

  era5_data:
    type: match
    class: ea

  era5_license:
    type: has_license
    license: era5

transforms:

  expand:
    type: metkit_expansion
    expand_parameters: true

targets:

  mars_od:
    type: http
    url: "http://mars.ecmwf.int:8080/retrieve"
    dispatcher:
      queue: cost_weighted
      concurrency: 10

  dss_od:
    type: http
    url: "http://dss.ecmwf.int:9090/retrieve"
    dispatcher:
      queue: fifo
      concurrency: 8

routes:

  operational_forecast:
    - transform::expand
    - check::valid_data
    - target::mars_od

  era5_reanalysis:
    - transform::expand
    - switch:
        era5_privileged:
          - check::era5_data
          - check::era5_license
          - target::dss_od
        era5_public:
          - check::era5_data
          - target::dss_od

  extremes_dt:
    - check::valid_data
    - transform::expand
    - target::dss_od

  extremes_fc:
    - check::valid_data
    - transform::expand
    - target::dss_od
