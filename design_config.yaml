# Example ECMWF routing config demonstrating the full dispatcher architecture.
#
# Dispatcher config (queue, executor, concurrency) lives inside a `dispatcher:`
# key within the registry entry, or as a sibling `dispatcher:` key for inline steps.
#
# queue:
#   fifo          — first-in, first-out ordering
#   cost_weighted — cheaper jobs (lower metadata["cost"]) run first
#
# executor:
#   semaphore     — inline async, bounded by concurrency (default)
#   thread_pool   — offload to dedicated OS threads (CPU/blocking work)
#   remote_pool   — hand off to external workers via HTTP long-poll
#                   (only valid with target::remote)
#
# concurrency: <n>  — max simultaneous executions

checks:

  valid_data:
    type: has_role
    role: valid_forecast

  era5_data:
    type: match
    class: ea

  era5_license:
    type: has_license
    license: era5

transforms:

  expand:
    type: metkit_expansion
    expand_parameters: true
    dispatcher:
      concurrency: 16           # limit concurrent calls to the expansion service

targets:

  mars_od:
    type: http
    url: "http://mars.ecmwf.int:8080/retrieve"
    dispatcher:
      queue: cost_weighted      # cheap jobs first
      executor:
        type: thread_pool     # run each job on a dedicated thread to avoid blocking the dispatcher
        concurrency: 10


  dss_od:
    type: http
    url: "http://dss.ecmwf.int:9090/retrieve"
    dispatcher:
      queue: fifo
      executor:
        type: semaphore
        concurrency: 8

  fdb_worker:
    type: remote              # noop — work is done by external FDB workers
    dispatcher:
      queue: cost_weighted
      executor:
        type: remote_pool
        remote_pool:
          bind: "0.0.0:9001"
          heartbeat_timeout_secs: 60


routes:

  operational_forecast:
    - transform::expand
    - check::valid_data
    - transform::uses_tapes_or_not
    - transform::tape_cost_estimation
      dispatcher:
        queue: cost_weighted
        executor:
          type: thread_pool
          concurrency: 20
    - persist
    - target::mars_od

  era5_reanalysis:
    - transform::expand
    - switch:
        era5_privileged:
          - check::era5_data
          - check::era5_license
            dispatcher:
              queue: fifo
              executor:
                type: semaphore
                concurrency: 400
          - persist
          - target::dss_od
        era5_public:
          - check::era5_data
          - target::dss_od

  extremes_dt:
    - check::valid_data
    - transform::expand
    - target::fdb_worker

  extremes_fc:
    - check::valid_data
    - transform::expand
    - target::fdb_worker
