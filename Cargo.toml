[package]
name = "bits"
version = "0.1.0"
edition = "2021"

[lib]
name = "bits"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "custom_action_registration"
path = "examples/custom_action_registration.rs"

[dependencies]
async-trait = "0.1.88"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
inventory = "0.3"
