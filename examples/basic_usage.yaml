# bits_config.yaml

# Define reusable action groups first

actions:

  - &valid_data
    check::has_role:
      role: "valid_forecast"

  - &era5_data
    check::match:
      class: "ea"

  - &era5_license
    check::has_license:
      license: "era5"

  - &mars_od
    route::mars_destination:
      endpoint: "mars.ecmwf.int:8080"

  - &metkit_expansion
    via::metkit_expansion:
      expand_parameters: true

routes:

  operational_forecast:
    - *metkit_expansion
    - *valid_data
    - *mars_od

  era5_reanalysis:
    - *metkit_expansion
    - switch:
        era5_priveleged:
          - *era5_data
          - *era5_license
          - route::dss_destination:
              endpoint: "dss.ecmwf.int:9090"
        era5_public:
          - *era5_data
          - route::dss_destination:
              endpoint: "dss.ecmwf.int:9090"

  extremes_dt:
    - *valid_data
    - *metkit_expansion
    - route::dss_destination:
        endpoint: "dss.ecmwf.int:9090"

  extremes_fc:
    - *valid_data
    - *metkit_expansion
    - route::dss_destination:
        endpoint: "dss.ecmwf.int:9090"
